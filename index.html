<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Snake Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.5);
            --food-color: #ef4444;
            --food-glow: rgba(239, 68, 68, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            max-width: 500px;
            padding: 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .score-board {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .high-score-value {
            color: var(--primary-color);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--surface-color);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 40px var(--primary-glow);
            border: 2px solid var(--border-color);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            text-align: center;
        }

        .btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 var(--primary-glow);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .controls-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            #game-container {
                padding: 0.5rem;
                gap: 1rem;
            }
            header {
                padding: 0.75rem 1rem;
            }
            .overlay h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <div class="score-board">
                <span class="score-label">Score</span>
                <span class="score-value" id="current-score">0</span>
            </div>
            <div class="score-board" style="text-align: right;">
                <span class="score-label">High Score</span>
                <span class="score-value high-score-value" id="high-score">0</span>
            </div>
        </header>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="start-overlay" class="overlay active">
                <h2>Snake</h2>
                <p>Swipe or use Arrow Keys to move</p>
                <button class="btn" id="start-btn">Start Game</button>
            </div>

            <div id="game-over-overlay" class="overlay">
                <h2>Game Over!</h2>
                <p id="final-score-text">You scored 0 points</p>
                <button class="btn" id="restart-btn">Play Again</button>
            </div>
        </div>

        <div class="controls-hint">
            Desktop: Arrow Keys / WASD &bull; Mobile: Swipe
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('current-score');
        const highScoreElement = document.getElementById('high-score');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const finalScoreText = document.getElementById('final-score-text');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let speed = 120; // Lower is faster (ms per frame)
        
        // Game state
        let snake = [];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoopTimer;
        let isPlaying = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            // Initial snake configuration
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            speed = 120;
            
            scoreElement.textContent = score;
            placeFood();
            
            isPlaying = true;
            startOverlay.classList.remove('active');
            gameOverOverlay.classList.remove('active');
            
            if (gameLoopTimer) clearTimeout(gameLoopTimer);
            gameLoop();
        }

        function gameLoop() {
            if (!isPlaying) return;
            
            update();
            draw();
            
            gameLoopTimer = setTimeout(gameLoop, speed);
        }

        function update() {
            // Apply next intended direction to prevent fast reversing
            dx = nextDx;
            dy = nextDy;

            // Calculate new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check collision with walls
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check collision with self
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head); // Add new head

            // Check if food eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                // Increase speed slightly up to a limit
                if (speed > 50) speed -= 2;
                placeFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1e293b'; // var(--surface-color)
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (optional, adds texture)
            ctx.strokeStyle = 'rgba(255,255,255,0.02)';
            for(let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ef4444'; // var(--food-color)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for snake

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#10b981'; // var(--primary-color)
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#10b981';
                } else {
                    // Body - slight gradient effect based on position
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                // Rounded rectangles for modern look
                const offset = 1;
                const size = gridSize - (offset * 2);
                const r = 4; // border radius
                
                const x = segment.x * gridSize + offset;
                const y = segment.y * gridSize + offset;

                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + size - r, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + r);
                ctx.lineTo(x + size, y + size - r);
                ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
                ctx.lineTo(x + r, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        function placeFood() {
            let newFoodPosition;
            let isValid = false;
            while (!isValid) {
                newFoodPosition = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                isValid = true;
                // Ensure food doesn't spawn on the snake
                for (let segment of snake) {
                    if (segment.x === newFoodPosition.x && segment.y === newFoodPosition.y) {
                        isValid = false;
                        break;
                    }
                }
            }
            food = newFoodPosition;
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            finalScoreText.textContent = `You scored ${score} points!`;
            gameOverOverlay.classList.add('active');
        }

        function changeDirection(newDx, newDy) {
            // Prevent 180 degree turns instantly
            if ((newDx === 1 && dx === -1) || 
                (newDx === -1 && dx === 1) ||
                (newDy === 1 && dy === -1) ||
                (newDy === -1 && dy === 1)) {
                return;
            }
            nextDx = newDx;
            nextDy = newDy;
        }

        // Keyboard controls
        window.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (!isPlaying) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (startOverlay.classList.contains('active') || gameOverOverlay.classList.contains('active')) {
                        initGame();
                    }
                }
                return;
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(1, 0);
                    break;
            }
        });

        // Touch (Swipe) controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling while playing
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            // Require a minimum swipe distance
            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal swipe
                    if (dx > 0) changeDirection(1, 0); // Right
                    else changeDirection(-1, 0); // Left
                } else {
                    // Vertical swipe
                    if (dy > 0) changeDirection(0, 1); // Down
                    else changeDirection(0, -1); // Up
                }
            }
            e.preventDefault();
        }, {passive: false});

        // Button listeners
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        // Initial empty draw
        draw();
    </script>
</body>
</html>
